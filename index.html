<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003399">
    <link rel="icon" type="image/jpeg" href="x-ray.png">
    <title>Scanner F-CGO-004 - Azul Cargo</title>
    <script src="https://unpkg.com/html5-qrcode?v=3"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 15px; background-color: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        h2 { color: #003399; margin-bottom: 5px; }
        .count-box { background: #eef2ff; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d1d9e6; }
        .progress-container { background-color: #ddd; border-radius: 10px; height: 10px; width: 100%; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background-color: #28a745; transition: width 0.3s; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #reader { width: 100%; border-radius: 12px; margin-top: 10px; background: #000; }
        button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-camera { background-color: #003399; color: white; }
        .btn-pdf { background-color: #28a745; color: white; }
        .btn-limpar { background-color: #f0ad4e; color: white; }
        .btn-limpar:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.7; }
        #status { margin-top: 15px; font-weight: bold; min-height: 20px; }
        #reader { overflow: hidden; position: relative; }
        #reader video { touch-action: none; object-fit: cover; }
        /* Mantém a área da câmera estável em celulares com proporções diferentes. */
        #reader__scan_region { min-height: 240px; }

    </style>
</head>
<body>

<div class="card">
    <h2>Scanner Azul Cargo</h2>
    <p style="font-size: 12px; margin-bottom: 15px;">Inspeção de Carga F-CGO-004</p>

    <div class="count-box">
        <strong>Itens Bipados:</strong> <span id="contagem">0</span> / 21
        <div class="progress-container">
            <div id="barra" class="progress-bar"></div>
        </div>
    </div>

    <input type="text" id="nome" placeholder="Nome do APAC">
    <input type="text" id="re" placeholder="RE">
    
    <div id="reader"></div>

    <button onclick="alternarEntradaManual()" id="btnManual" 
            style="margin-top: 15px; background: none; border: 1px solid #003399; color: #003399; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold;">
        ⌨️ Entrada Manual de Dados
    </button>

    <div id="manual-input-container" style="display: none; margin-top: 15px; flex-direction: column; align-items: center; gap: 10px; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #ddd;">
        <input type="text" id="m-codigo" placeholder="CTE ou Saco Coletor" style="width: 90%; padding: 10px;">
        <input type="text" id="m-destino" placeholder="Destino" style="width: 90%; padding: 10px;">
        <div style="display: flex; gap: 5px; width: 95%; justify-content: center;">
            <input type="number" id="m-total" placeholder="Qtd Total" style="width: 45%; padding: 10px;">
            <input type="number" id="m-inspec" placeholder="Qtd Inspec" style="width: 45%; padding: 10px;">
        </div>
        <div style="display: flex; gap: 10px; width: 95%;">
            <button onclick="processarManual()" style="flex: 2; background-color: #003399; color: white; padding: 10px;">GRAVAR DADOS</button>
            <button onclick="alternarEntradaManual()" style="flex: 1; background-color: #666; color: white; padding: 10px;">VOLTAR</button>
        </div>
    </div>
    
    <button class="btn-camera" id="btnAcao" onclick="toggleCamera()">LER QRCODE</button>
    <div id="status"></div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <button class="btn-pdf" onclick="encerrarTurno()">ENCERRAR TURNO</button>
    <button id="btnLimpar" class="btn-limpar" onclick="confirmarLimpeza()" disabled>LIMPAR PLANILHA</button>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQq3LaV-duUZzCRgoKwTdzWjBXaKiqPgDCMZU4RA6mTUV8-GHWV7j740IA_DImHwRpUA/exec'; 
    
    // Declaração única limpa
    let html5QrCode = null;
    let cameraAtiva = false;

    // --- VARIÁVEIS DE ZOOM POR PINÇA ---
    let zoomMin = 1;
    let zoomMax = 1;
    let zoomAtual = 1;
    let zoomStep = 0.1;
    let zoomDisponivel = false;
    let distanciaInicialPinch = 0;
    let zoomInicialPinch = 1;
    let ultimoZoomAplicado = 0;
    let aplicandoZoom = false;

    window.onload = function() {
        fetch(scriptURL + '?action=getContagem')
        .then(r => r.text())
        .then(res => { atualizarContador(res); });
    };

    function atualizarContador(valor) {
        const n = parseInt(valor) || 0;
        document.getElementById('contagem').innerText = n;
        const barra = document.getElementById('barra');
        const btnLimpar = document.getElementById('btnLimpar');
        barra.style.width = (n / 21 * 100) + "%";
        btnLimpar.disabled = (n < 21);
        barra.style.backgroundColor = n >= 21 ? "#003399" : (n >= 18 ? "#d9534f" : "#28a745");
    }

    function enviarParaPlanilha(objetoDados) {
        document.getElementById('status').innerText = "Enviando...";
        fetch(scriptURL, { method: 'POST', body: JSON.stringify(objetoDados) })
        .then(r => r.text())
        .then(res => {
            if (res === "REPETIDO") {
                if (confirm("Código já registrado. Enviar novamente?")) {
                    objetoDados.confirmarRepetido = true;
                    enviarParaPlanilha(objetoDados);
                } else { document.getElementById('status').innerText = "Cancelado"; }
            } else if (res === "CHEIA") {
                alert("Planilha cheia!");
            } else {
                atualizarContador(res);
                document.getElementById('status').innerText = "✅ Registrado (" + res + "/21)";
            }
        }).catch(err => { document.getElementById('status').innerText = "Erro de conexão"; });
    }

    function alternarEntradaManual() {
        const container = document.getElementById('manual-input-container');
        const btnManual = document.getElementById('btnManual');
        container.style.display = container.style.display === "none" ? "flex" : "none";
        btnManual.style.display = container.style.display === "none" ? "inline-block" : "none";
    }

    function processarManual() {
        let codigoRaw = document.getElementById('m-codigo').value.trim().toUpperCase();
        let cteFormatado = codigoRaw;
        let tipo = "SACO";

        if (codigoRaw.startsWith("577") || (/^\d{8}$/.test(codigoRaw))) {
            tipo = "577";
            if (codigoRaw.startsWith("577")) {
                cteFormatado = codigoRaw.substring(3, 11); 
            } else {
                cteFormatado = codigoRaw.substring(0, 8);
            }
        } else if (/[A-Z]{2,}/.test(codigoRaw)) {
            tipo = "SACO";
            cteFormatado = codigoRaw;
        }

        const dados = {
            data: new Date().toLocaleString('pt-BR'),
            cte: cteFormatado,
            destino: document.getElementById('m-destino').value.trim().toUpperCase(),
            qtdTotal: document.getElementById('m-total').value,
            qtdInspec: document.getElementById('m-inspec').value,
            tipo: tipo,
            nome: document.getElementById('nome').value,
            re: document.getElementById('re').value,
            confirmarRepetido: false
        };

        if (!dados.cte || !dados.destino || !dados.nome || !dados.re) {
            alert("Por favor, preencha todos os campos obrigatórios.");
            return;
        }

        enviarParaPlanilha(dados);
        document.getElementById('m-codigo').value = "";
        document.getElementById('m-destino').value = "";
        document.getElementById('m-total').value = "";
        document.getElementById('m-inspec').value = "";
        alternarEntradaManual();
    }

    async function prepararZoomManual() {
        zoomDisponivel = false;
        if (!html5QrCode || !cameraAtiva) return;

        try {
            const caps = html5QrCode.getRunningTrackCapabilities();
            const zoom = caps && caps.zoom;

            // Solicita foco contínuo quando o navegador/celular oferece esse recurso.
            try {
                await html5QrCode.applyVideoConstraints({
                    advanced: [{ focusMode: 'continuous' }]
                });
            } catch (_) {
                // Alguns aparelhos não expõem focusMode pela câmera web.
            }

            if (zoom && typeof zoom.min === 'number' &&
                typeof zoom.max === 'number' && zoom.max > zoom.min) {
                zoomMin = zoom.min;
                zoomMax = zoom.max;
                zoomStep = Number(zoom.step) || Math.max(0.1, (zoomMax - zoomMin) / 100);

                // Começa no zoom óptico/digital mínimo suportado, sem forçar um valor inválido.
                const settings = html5QrCode.getRunningTrackSettings
                    ? html5QrCode.getRunningTrackSettings()
                    : {};
                const zoomConfigurado = settings && typeof settings.zoom === 'number'
                    ? settings.zoom : zoomMin;

                zoomAtual = Math.max(zoomMin, Math.min(zoomMax, zoomConfigurado));
                zoomDisponivel = true;

                // Reaplica o valor atual com o formato de constraints mais compatível.
                await aplicarZoomNativo(zoomAtual);
            } else {
                // O zoom nativo não é disponibilizado por todos os navegadores.
                zoomMin = 1;
                zoomMax = 1;
                zoomAtual = 1;
            }
        } catch (e) {
            zoomDisponivel = false;
            console.debug('Controles avançados da câmera indisponíveis:', e);
        }
    }

    async function aplicarZoomNativo(valor) {
        if (!html5QrCode) return false;

        // Tenta os dois formatos usados pelos navegadores para aplicar zoom.
        try {
            await html5QrCode.applyVideoConstraints({
                advanced: [{ zoom: valor }]
            });
            return true;
        } catch (_) {
            try {
                await html5QrCode.applyVideoConstraints({ zoom: valor });
                return true;
            } catch (e) {
                console.debug('Zoom nativo não aceito pela câmera:', e);
                return false;
            }
        }
    }

    function distanciaEntreDedos(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // Ouvintes de pinça configurados de forma segura
    setTimeout(() => {
        const areaCamera = document.getElementById('reader');
        if (areaCamera) {
            areaCamera.style.touchAction = 'none';
            areaCamera.addEventListener('touchstart', (event) => {
                if (!cameraAtiva || event.touches.length !== 2) return;
                event.preventDefault();
                distanciaInicialPinch = distanciaEntreDedos(event.touches);
                zoomInicialPinch = zoomAtual;
                ultimoZoomAplicado = 0;
            }, { passive: false });

            areaCamera.addEventListener('touchmove', (event) => {
                if (!cameraAtiva || event.touches.length !== 2 || !distanciaInicialPinch) return;
                event.preventDefault();
                if (!zoomDisponivel || aplicandoZoom) return;
                const distanciaAtual = distanciaEntreDedos(event.touches);
                const escala = distanciaAtual / distanciaInicialPinch;
                let novoZoom = Math.max(zoomMin, Math.min(zoomMax, zoomInicialPinch * escala));
                novoZoom = Math.round(novoZoom / zoomStep) * zoomStep;
                novoZoom = Math.max(zoomMin, Math.min(zoomMax, Number(novoZoom.toFixed(2))));
                if (Math.abs(novoZoom - zoomAtual) < zoomStep || Date.now() - ultimoZoomAplicado < 90) return;

                ultimoZoomAplicado = Date.now();
                aplicandoZoom = true;
                aplicarZoomNativo(novoZoom).then(aplicado => {
                    if (aplicado) zoomAtual = novoZoom;
                }).finally(() => { aplicandoZoom = false; });
            }, { passive: false });

            const encerrarPinch = () => { distanciaInicialPinch = 0; };
            areaCamera.addEventListener('touchend', encerrarPinch, { passive: true });
            areaCamera.addEventListener('touchcancel', encerrarPinch, { passive: true });
        }
    }, 500);

    function toggleCamera() {
        if (!cameraAtiva) {
            if(!document.getElementById('nome').value || !document.getElementById('re').value) {
                alert("Preencha Nome e RE primeiro."); return;
            }
            
            html5QrCode = new Html5Qrcode("reader", {
                useBarCodeDetectorIfSupported: true,
                formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
            });

            // Configuração com qrbox seguro em pixels fixos para evitar erros de cálculo
            const config = {
                fps: 20,
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    // Caixa responsiva: não excede a imagem disponível no E13 nem no A23.
                    const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.78);
                    return { width: Math.max(180, lado), height: Math.max(180, lado) };
                },
                aspectRatio: 1.0,
                disableFlip: true,
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => { 
                cameraAtiva = true; 
                document.getElementById('btnAcao').innerText = "DESLIGAR CÂMERA"; 
                setTimeout(prepararZoomManual, 700);
            })
            .catch(err => {
                console.warn("Tentando modo alternativo de câmera...", err);
                html5QrCode.start({ facingMode: "environment" }, {
                    fps: 15,
                    qrbox: (viewfinderWidth, viewfinderHeight) => {
                        const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.75);
                        return { width: Math.max(180, lado), height: Math.max(180, lado) };
                    },
                    aspectRatio: 1.0,
                    disableFlip: true
                }, onScanSuccess).then(() => {
                    cameraAtiva = true;
                    document.getElementById('btnAcao').innerText = "DESLIGAR CÂMERA";
                    setTimeout(prepararZoomManual, 700);
                }).catch(e => {
                    alert("Não foi possível iniciar a câmera.");
                });
            });
        } else { 
            pararCamera(); 
        }
    }

    function pararCamera() {
        if (html5QrCode && cameraAtiva) {
            html5QrCode.stop().then(() => { 
                cameraAtiva = false; 
                document.getElementById('btnAcao').innerText = "LER QRCODE"; 
            }).catch(() => { cameraAtiva = false; });
        }
    }

    function onScanSuccess(decodedText) {
        pararCamera();
        let partes = decodedText.split('|');
        let cte, destino, qtdTotal, tipo;

        if (decodedText.startsWith("577")) {
            tipo = "577";
            cte = decodedText.substring(3, 11); 
            let destinoBruto = partes[7] || "N/I";
            let destinoPartes = destinoBruto.split('-');
            destino = destinoPartes[destinoPartes.length - 1].trim(); 
            qtdTotal = partes[9] || "0";
        } else {
            tipo = "SACO";
            cte = partes[0];
            destino = partes[3] || "N/I";
            qtdTotal = "1";
        }

        let qtdInspec = prompt(`CTE: ${cte}\nDestino: ${destino}\nVolumes inspecionados?`, "1");
        if (qtdInspec === null) return;

        enviarParaPlanilha({
            data: new Date().toLocaleString('pt-BR'),
            cte: cte, 
            destino: destino, 
            qtdTotal: qtdTotal, 
            qtdInspec: qtdInspec,
            tipo: tipo, 
            nome: document.getElementById('nome').value, 
            re: document.getElementById('re').value,
            confirmarRepetido: false
        });
    }

    function confirmarLimpeza() {
        if (confirm("Limpar planilha?")) {
            fetch(scriptURL + '?action=limpar').then(() => { atualizarContador(0); });
        }
    }

    function encerrarTurno() {
        if (confirm("Encerrar turno e arquivar?")) {
            const url = `${scriptURL}?action=encerrar&nome=${encodeURIComponent(document.getElementById('nome').value)}&re=${encodeURIComponent(document.getElementById('re').value)}`;
            fetch(url).then(r => r.text()).then(res => { if(res==="OK") { alert("Arquivado!"); atualizarContador(0); }});
        }
    }
</script>
</body>
</html>
